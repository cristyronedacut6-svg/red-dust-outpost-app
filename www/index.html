<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Red Dust Outpost</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0a12">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Red Dust"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Pixelify+Sans:wght@500;700&family=Quicksand:wght@600;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed game screen. HUD and mission feed float top-left, menu top-right,
   joystick bottom-left, action buttons bottom-right, build dock bottom-middle.
   One deliberate dark "mission console" look, so no light theme. */
:root{--void:#0d0a12;--panel:rgba(20,15,28,.86);--panel2:#231b30;--line:rgba(255,236,220,.18);--ink:#f5ede4;--dim:#b8acc2;
--signal:#ff7a3d;--ok:#5fe08a;--warn:#ffcf4a;--bad:#ff5466;--cool:#6cc8ff;
--disp:"Pixelify Sans","Courier New",monospace;--ui:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--ui);overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
#c{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.ui{position:absolute;z-index:3}

/* HUD */
#top{left:calc(8px + var(--sl));top:calc(8px + var(--st));display:flex;flex-direction:column;gap:5px;max-width:min(620px,calc(100% - 150px));pointer-events:none}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:3px 8px;display:flex;align-items:center;gap:5px;font-weight:600;font-size:13px;line-height:1.25;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-weight:700}.chip small{font-size:11px;font-weight:500;opacity:.85}
.chip.res{padding:3px 7px 3px 6px}
.mb{width:34px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}.mb i{display:block;height:100%;transition:width .25s}
#wid{position:fixed;left:50%;top:30%;width:max-content;transform:translate(-50%,8px);z-index:60;display:flex;gap:14px;align-items:center;padding:12px 20px 12px 14px;border-radius:16px;background:linear-gradient(90deg,rgba(8,12,28,.95),rgba(8,12,28,.86));border:1px solid rgba(255,255,255,.12);border-left:4px solid var(--wc,#7df9ff);box-shadow:0 10px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .7s,transform .7s;max-width:min(92vw,560px)}#wid.on{opacity:1;transform:translate(-50%,0)}#wid .wem{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:inset -8px -6px 14px rgba(0,0,0,.55),0 0 18px rgba(255,255,255,.12)}#wid small{display:block;font:600 11px Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9fb3c8}#wid b{display:block;font:800 30px/1.05 Inter,system-ui,sans-serif;letter-spacing:.1em}#wid span{display:block;font:500 13px Inter,system-ui,sans-serif;color:#dfe7f1;margin-top:3px}#wave{border-left:3px solid var(--wc,transparent)}@media (max-height:500px){#wid{top:46%;padding:8px 14px 8px 10px}#wid b{font-size:22px}#wid span{font-size:11.5px}#wid .wem{width:36px;height:36px}}
.chip.res{position:relative}.chip.res.w::after{content:'!';position:absolute;top:-6px;right:-5px;width:15px;height:15px;border-radius:50%;background:#ff5466;color:#fff;font:800 11px/15px Inter,system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px #0d0a12}#res small.crit{color:#ff8a9a;font-weight:800}
.chip.w{border-color:var(--bad);background:rgba(90,16,28,.9);animation:blink .7s steps(2) infinite}
@keyframes blink{50%{border-color:transparent}}
.pos{color:var(--ok)}.neg{color:var(--bad)}
#wave{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.02em}
.daybar{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}.daybar i{display:block;height:100%}
.feed{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.msg{background:var(--panel);border-left:3px solid var(--warn);border-radius:6px;padding:4px 9px;font-size:13px;max-width:100%;white-space:normal}
.ban{pointer-events:auto;border-radius:8px;padding:7px 10px;font-size:13.5px;line-height:1.35;max-width:min(520px,100%);display:flex;gap:8px;align-items:flex-start}
.ban.fact{background:rgba(18,34,74,.92);border:1px solid #7fb0ff}
.ban.mc{background:rgba(14,52,40,.93);border:1px solid var(--ok)}
.ban.tut{background:rgba(92,58,4,.95);border:2px solid var(--warn);font-weight:600;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-2px)}}
.ban .lab{font-family:var(--disp);font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;display:block}
.ban button{margin-left:auto;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;flex:none}
#boss{background:var(--panel);border:1px solid var(--bad);border-radius:7px;padding:4px 8px;font-family:var(--disp);font-size:13px;width:min(320px,100%)}
#boss .mb{width:100%;height:7px;margin-top:3px}

#tr{right:calc(8px + var(--sr));top:calc(8px + var(--st));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#tr .r{display:flex;gap:6px}
#tr .r.v3o{display:none}body.v3d #tr .r.v3o{display:flex}#c3{image-rendering:auto}body.v3d #b3d{background:var(--cool,#2a6bd8);color:#fff}
.tb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-weight:700;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
#bShop{background:var(--signal);color:#1d0b02;border-color:transparent}
#nextw{background:#173a2a;border-color:var(--ok);font-size:13px}

#wb{position:absolute;inset:38% 0 auto;text-align:center;font:700 clamp(28px,6vw,52px) var(--disp);color:#fff;text-shadow:0 4px 0 #000,0 0 24px rgba(255,122,61,.8);opacity:0;pointer-events:none;z-index:2;transform:scale(.8);transition:opacity .35s,transform .35s}
#wb.on{opacity:1;transform:scale(1)}#wb.low{inset:66% 0 auto}
#stage.cine #dock,#stage.cine #act,#stage.cine #joy,#stage.cine #ctx,#stage.cine #tr,#stage.cine #top{display:none!important}
#cin{position:absolute;inset:0;z-index:3;pointer-events:none}
#cin .lb{position:absolute;left:0;right:0;height:0;background:#000;transition:height .4s ease}#cin .lb.t{top:0}#cin .lb.b{bottom:0}#cin.on .lb{height:12%}
#cin .ct{position:absolute;left:0;right:0;bottom:15%;text-align:center;opacity:0;transform:translateY(12px) scale(.96);transition:opacity .45s .2s,transform .45s .2s}#cin.on .ct{opacity:1;transform:none}
#cin .cic{display:block;font-size:30px;line-height:1.1}#cin .ct b{display:block;font:700 clamp(24px,5.4vw,46px) var(--disp);color:#fff;letter-spacing:.04em;text-shadow:0 3px 0 #000,0 0 26px var(--c)}
#cin .ct small{display:block;font:600 14px var(--ui);color:#e6e6ee;text-shadow:0 2px 0 #000;margin-top:3px;padding:0 16px}
#cinSk{position:absolute;right:calc(12px + var(--sr));top:calc(12% + 8px);pointer-events:auto;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 11px;font:600 13px var(--ui)}
#photo{position:absolute;inset:0;z-index:4}#phd{position:absolute;inset:0;touch-action:none;cursor:grab}
#photo .phbar{position:absolute;left:50%;bottom:calc(10px + var(--sb));transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 20px)}
#photo .tb.pri{background:var(--accent,#ff7a3d);color:#fff}#phHint{position:absolute;top:calc(10px + var(--st));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);padding:4px 10px;border-radius:8px;font-size:13px;pointer-events:none}
#phFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}#phFlash.go{animation:phf .5s ease-out}@keyframes phf{0%{opacity:.85}100%{opacity:0}}
#phPrev{position:absolute;inset:5% 8% calc(58px + var(--sb));background:rgba(12,9,20,.96);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center}
#phPrev img{max-width:100%;max-height:68%;border-radius:8px;border:1px solid var(--line)}#phPrev a.btn{text-decoration:none}
#wb small{display:block;font:600 15px var(--ui);text-shadow:0 2px 0 #000;margin-top:4px}

/* controls */
#joy{left:0;bottom:0;width:42%;height:62%;z-index:2;touch-action:none}
#jb,#jk{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
#jb{width:110px;height:110px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07)}
#jk{width:50px;height:50px;background:rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.5)}
#jhint{position:absolute;left:calc(26px + var(--sl));bottom:calc(26px + var(--sb));width:96px;height:96px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-size:12px;color:rgba(255,255,255,.65);text-align:center;pointer-events:none}
#act{right:calc(10px + var(--sr));bottom:calc(10px + var(--sb));display:flex;gap:8px;align-items:flex-end}
.rb{border-radius:50%;border:2px solid rgba(255,255,255,.55);color:#fff;font-weight:700;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.5);position:relative;touch-action:none;line-height:1.05;text-align:center}
.rb:active,.rb.dn{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
#fire{width:86px;height:86px;background:radial-gradient(circle at 35% 30%,#ff8c66,#d8321c);font-size:13px;grid-row:1/3;grid-column:2}
#emp{width:58px;height:58px;background:#2b4fa8;font-size:12px}
#emp .cdw{position:absolute;inset:-2px;border-radius:50%;pointer-events:none}
#emp.cool{filter:saturate(.3) brightness(.7)}
#wsw{width:50px;height:50px;background:#4a3a5e;font-size:18px}
#act .col{display:flex;flex-direction:column;gap:8px;align-items:center;grid-row:1/3;grid-column:1}
#dock{left:50%;transform:translateX(-50%);bottom:calc(8px + var(--sb));display:flex;gap:6px;align-items:flex-end;max-width:calc(100% - 2 * 236px - var(--sl) - var(--sr));z-index:3}
#cards{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px;border-radius:12px;background:rgba(10,7,14,.6);border:1px solid var(--line)}
#cards::-webkit-scrollbar{display:none}
.card{flex:none;width:56px;padding:4px 2px 3px;border-radius:9px;background:var(--panel2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;line-height:1.1}
.card img{width:30px;height:30px;image-rendering:pixelated}
.card .cost{font-size:10px;color:var(--warn);font-variant-numeric:tabular-nums}
.card.sel{border-color:var(--signal);background:#3a2418;box-shadow:0 0 0 2px rgba(255,122,61,.35)}
.card.no{opacity:.45}
#bh{width:64px;height:64px;flex:none;background:#2a8f4a;font-size:12px;border-radius:16px}
#bh img{width:24px;height:24px;image-rendering:pixelated;display:block;margin:0 auto 1px}

/* inspect */
#insp{right:calc(8px + var(--sr));top:calc(54px + var(--st));width:min(300px,calc(100% - 24px));max-height:calc(100% - 160px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#insp h3{margin:0 0 2px;font:700 17px var(--disp);display:flex;align-items:center;gap:8px}
#insp h3 img{width:28px;height:28px;image-rendering:pixelated}
#insp p{margin:4px 0;font-size:13px;color:var(--dim);line-height:1.35}
#insp .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-weight:700;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--signal);color:#1d0b02;border-color:transparent}
.btn.okb{background:#1d5a37;border-color:var(--ok)}
.btn.x{margin-left:auto}

/* overlays */
#ov,#shop{position:absolute;inset:0;z-index:6;overflow:auto;background:rgba(9,6,13,.86);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{max-width:640px;margin:0 auto;padding:calc(18px + var(--st)) max(16px,calc(16px + var(--sr))) calc(24px + var(--sb)) max(16px,calc(16px + var(--sl)))}
.sheet h1{font:700 clamp(30px,6vw,46px)/1 var(--disp);margin:6px 0 6px;color:var(--signal);text-shadow:0 3px 0 #3a1204;letter-spacing:.02em}
.sheet h2{font:700 24px/1.15 var(--disp);margin:4px 0 8px;text-wrap:balance}
.sheet p{line-height:1.5;margin:6px 0;color:var(--ink)}
.sheet .sub{color:var(--dim)}
.eyebrow{font:700 12px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--warn)}
.worlds{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:14px 0 10px}
.wd{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px}
.wd .pl{width:42px;height:42px;border-radius:50%;box-shadow:inset -8px -6px 0 rgba(0,0,0,.35)}
.wd small{font-weight:500;color:var(--dim);font-size:11px}
.wd .stars{color:var(--warn);font-size:12px;letter-spacing:1px}
.wd.on{border-color:var(--signal);background:#2c1c20}
.wd:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 12px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--void)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.big{font:700 20px var(--disp);padding:12px 22px;border-radius:12px;background:var(--signal);color:#1d0b02;border:0;box-shadow:0 4px 0 #8a3510}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #8a3510}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.box h3{margin:0 0 6px;font:700 15px var(--disp);color:var(--cool);letter-spacing:.03em}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;font-variant-numeric:tabular-nums}
.stat div{background:rgba(0,0,0,.25);border-radius:8px;padding:6px 8px;font-size:13px}.stat b{display:block;font-size:17px}
.choice{display:block;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.choice:hover,.choice:focus-visible{border-color:var(--signal)}
.choice b{display:block;font-size:15.5px;margin-bottom:3px}
.fxl{display:flex;gap:5px;flex-wrap:wrap}.fxl span{font-size:12.5px;font-weight:700;padding:1px 7px;border-radius:5px;background:rgba(0,0,0,.35)}
.fxl .g{color:var(--ok)}.fxl .r{color:var(--bad)}
.q button{display:block;width:100%;text-align:left;margin:6px 0}
.q .right{border-color:var(--ok)!important;background:#16402a!important}.q .wrong{border-color:var(--bad)!important;background:#4a1620!important}
.starsbig{font-size:34px;color:var(--warn);letter-spacing:6px;text-shadow:0 3px 0 #5a3d00}
.starsbig .off{color:#4a4052;text-shadow:none}
.tabs{display:flex;gap:6px;margin:6px 0 10px}
.tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 14px;font-weight:700}
.tabs button.on{background:var(--ink);color:var(--void)}
.shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.it{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;text-align:left}
.it b{font-size:14.5px}.it span{font-size:12.5px;color:var(--dim);line-height:1.3}
.it .pr{color:var(--warn);font-weight:700;font-size:13px}
.it:disabled{opacity:.45;cursor:not-allowed}
.jw{margin:10px 0}.jw h3{font:700 16px var(--disp);margin:0 0 4px}
.jw li{margin:4px 0;line-height:1.4;font-size:13.5px}.jw li.lk{color:#6f6578}
.shead{display:flex;align-items:center;gap:10px;justify-content:space-between;position:sticky;top:0;background:rgba(9,6,13,.95);padding:6px 0;z-index:1}
#misb{cursor:pointer;color:inherit;font:inherit;font-weight:600;font-size:13px;pointer-events:auto}
.misp{pointer-events:auto;background:rgba(16,12,26,.94);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.45;max-width:340px;margin-top:4px}
.misp b{display:block;margin-bottom:2px}.misp .md{color:var(--ok)}.misp small{display:block;opacity:.7;margin-top:3px}
.techg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tech{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:6px}
.tech.got{border-color:var(--ok);background:rgba(95,224,138,.08)}.tech.lock{opacity:.6}
.tech .th{display:flex;gap:8px;align-items:flex-start}.tech .ti{font-size:24px;line-height:1}.tech small{display:block;opacity:.85;font-size:12.5px}
.tech .tf{margin:0;font-size:12px;opacity:.8;line-height:1.4}.tech .nb{color:var(--ok);font-weight:700;font-size:13px}.tech .btn{align-self:flex-start}
.chip small{opacity:.7;font-size:11px}
.rc .rgr{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.rc .rg,.rc .rtot{display:flex;flex-direction:column;align-items:center;min-width:52px;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.rc .rg b,.rc .rtot b{font:700 20px var(--disp);line-height:1.1}.rc .rtot b{font-size:28px}.rc small{font-size:11px;opacity:.8}.rc .rg span{font-size:13px}
.gA b{color:#5fe08a}.gB b{color:#9fe870}.gC b{color:#ffcf4a}.gD b{color:#ff9a3d}.gF b{color:#ff5466}
.rchart{width:100%;height:auto;background:rgba(0,0,0,.25);border-radius:8px;border:1px solid var(--line)}
.rleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;margin-top:3px;opacity:.85}.rleg span:before{content:'';display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle;background:var(--c)}
.rleg .bn:before{height:8px;background:rgba(110,120,220,.45)}.rleg .bs:before{height:8px;background:rgba(255,170,70,.45)}
.rtips{margin:2px 0 8px;padding-left:18px;font-size:13px;line-height:1.45}.rtips li{margin:3px 0}
.box.nasa{border-color:rgba(125,249,255,.35)}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}.ic.ib{width:26px;height:26px;display:block;margin:0 auto 1px}.ic.cn{color:#ffcf4a}.ic.or{color:#c9ced8}.ic.sm{width:.95em;height:.95em}.ic.wr{color:#ffcf4a}
#cr .ic{color:#ffcf4a}#ore .ic{color:#c9ced8}#crew .ic{color:#dfe6f0}#misb .ic{color:#ffcf4a}#wave .ic{color:#ffcf4a}
#res .chip{pointer-events:auto;cursor:pointer}#res .ri{display:flex}#r-pw .ic{color:#5aa0ff}#r-o2 .ic{color:#6fd8e8}#r-fd .ic{color:#5fe08a}#r-rad .ic{color:#ffcf4a}#r-hp .ic{color:#ff5466}#r-mo .ic{color:#ff9ad5}
body.clean #disc{display:none}body.clean #cin .cic{display:none}

/* ===== v22 design: one mission-control glass style ===== */
:root{--panel:rgba(9,13,24,.8);--panel2:rgba(19,25,43,.92);--line:rgba(150,190,255,.18);--ink:#eef2fb;--dim:#a3b2cb;--cool:#58c4ff;--disp:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;--logo:"Pixelify Sans","Courier New",monospace;--glass:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.012));--sh:0 6px 20px rgba(0,0,0,.45)}
html,body,#stage{background:#04060c}
#ov{background:radial-gradient(ellipse at 70% 25%,rgba(40,60,130,.22),rgba(3,5,12,.88) 72%)}
.sheet h1{font-family:var(--logo)}
.sheet h2{font-family:var(--disp);font-weight:700;letter-spacing:.01em}
.eyebrow{color:var(--cool)!important;letter-spacing:.16em;font-weight:700}
.box{background:var(--glass),var(--panel2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.05)}
.box h3{color:var(--cool);letter-spacing:.12em}
.btn{background:var(--glass),rgba(24,31,54,.94);border:1px solid var(--line);border-radius:11px;box-shadow:0 3px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .12s,border-color .2s,background .2s}
.btn:hover{border-color:rgba(120,190,255,.55)}.btn:active{transform:scale(.96)}
.big{background:linear-gradient(180deg,#ffa060,#ff6a2a);color:#1d0b02;border-radius:14px;box-shadow:0 6px 20px rgba(255,110,40,.35),inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 #8a3510;font-family:var(--disp);letter-spacing:.03em;transition:transform .1s}
.big:active{transform:translateY(2px) scale(.98)}
.chip,.tb{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0)),rgba(8,12,24,.82);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
#res{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0)),rgba(8,12,24,.82);border:1px solid var(--line);border-radius:12px;padding:2px 3px;gap:0!important;width:max-content;max-width:100%;box-shadow:0 4px 12px rgba(0,0,0,.35);pointer-events:auto}
#res .chip{background:none;border:0;box-shadow:none;border-radius:0}#res .chip+.chip{border-left:1px solid rgba(150,190,255,.13)}
.mb{height:6px;border-radius:4px}.mb i{position:relative;border-radius:4px}.mb i::after{content:'';position:absolute;inset:0;border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 70%)}
.rb{box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.25);transition:transform .08s}.rb:active,.rb.dn{transform:scale(.92)}
.card{background:var(--glass),rgba(14,18,33,.92);border:1px solid var(--line);border-radius:12px;transition:transform .1s,border-color .2s}.card:active{transform:scale(.95)}
.card.sel{border-color:#ff7a3d;box-shadow:0 0 0 1px #ff7a3d,0 0 14px rgba(255,122,61,.4)}
.ban,.msg,.emg{border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#ov:not([hidden]) .sheet{animation:ovin .3s cubic-bezier(.2,.9,.3,1.15) both}@keyframes ovin{from{opacity:0;transform:translateY(14px)}}
.starsbig span{display:inline-block;animation:starpop .6s cubic-bezier(.3,1.8,.5,1) both}.starsbig span:nth-child(1){animation-delay:.25s}.starsbig span:nth-child(2){animation-delay:.51s}.starsbig span:nth-child(3){animation-delay:.77s}@keyframes starpop{from{transform:scale(0) rotate(-60deg);opacity:0}}
.cuRow{display:flex;gap:8px;margin:8px 0}.cuRow>div{flex:1;text-align:center;background:var(--glass),var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 6px}.cuRow b{display:block;font:700 26px var(--logo);color:#ffe066;font-variant-numeric:tabular-nums}.cuRow small{color:var(--dim);font-size:12px}

#cred{position:absolute;inset:0;z-index:50;background:#000;overflow:hidden;color:#eef2fb;text-align:center}

function how(back){show(`<div class="eyebrow">Field manual</div><h2>How to play</h2>
 <div class="box"><h3>GOAL</h3><p style="margin:0">Keep your crew alive for 5 waves on each world, then defeat the Hive Queen. Clear a world to travel to the next one.</p></div>
 <div class="box"><h3>CONTROLS</h3><p style="margin:0"><b>Phone:</b> drag on the left side to walk. Hold 🔫 FIRE to shoot (it aims for you). ⚡ EMP stuns nearby aliens. Pick a module in the bottom bar (on a phone held upright, tap Choose first) and tap 🏗 Build. Tap a building to upgrade, repair or sell it. Tap 💨 DODGE to roll out of danger.<br><b>Keyboard:</b> WASD to walk, Space to shoot, Shift or K to dodge, J to jump (3D), E for EMP, Q to switch weapon, B to build, 1–9 to pick a module, M for the shop, P to pause.</p></div>
 <div class="box"><h3>EXPLORE</h3><p style="margin:0">Each world is bigger than your screen. The map in the top-right shows where you have been. Find the 3 hidden discovery sites (❓) for rewards, real science facts and a star. Walk up to the 🚙 rover and tap Drive rover (or press R) to go faster. Out in the dark you may find abandoned outposts, crashed ships, caves and alien nests, and meteor showers can strike at any time.</p></div>
 <div class="box"><h3>BOSSES</h3><p style="margin:0">The final wave on every world brings a unique boss: the Crystal Golem, Great Dust Worm, Solar Scorcher, Ice Kraken, Hive Queen, Asteroid Colossus and the Hive Mind. Red circles and lines on the ground show where an attack will land, and bosses fire bullet patterns between attacks.<br><b>How to win:</b> bosses are armored. Right after an attack their weak point glows gold: hit it then for big damage. Fill the yellow bar under their health to stagger them. At 66% and 33% health they change phase and get new moves.<br><b>💨 Dodge:</b> you are untouchable while rolling (2 charges). Dodge just as an attack lands for a PERFECT DODGE: time slows, you get the charge back and the weak point opens. Each boss win gets a rank from C to S.<br><b>⚡ Burst:</b> hitting enemies charges the ring on the BURST button. When it is full, tap it (or press T) for an orbital strike that hits hard, breaks the boss’s guard and opens its weak point.</p></div>
 <div class="box"><h3>CREW</h3><p style="margin:0">Your astronauts walk around the base doing their jobs. Tap 👩‍🚀 at the top to change jobs: Engineers repair, Medics heal, Scientists boost discoveries, Botanists grow food, Pilots speed up the rover and Earth help, and Miners dig more ore. A new astronaut arrives on wave 4 (up to 6). More crew means more air and food needed.</p></div>
 <div class="box"><h3>3D CAMERA</h3><p style="margin:0">In 3D, tap 🎥 to switch the camera: top view, behind your astronaut, or first person (through your astronaut’s eyes). Behind you and in first person, push the joystick up to walk and left or right to turn. Drag the screen to look around. Keyboard: G switches the camera, A and D turn.</p></div>
 <div class="box"><h3>EARTH SUPPORT</h3><p style="margin:0">The 🌍 EARTH button charges over time and when you defeat aliens. Tap it to call help from home: a supply pod, an orbital laser, a robot ally or a shield dome. Keyboard: Z, X, C, V.</p></div>
 <div class="box"><h3>THE BALANCE</h3><p style="margin:0">⚡ Power runs everything. Solar works only in daylight, batteries store it, RTGs make it all the time.<br>💨 Air and 🌽 food come from O2 generators and farms, which both use power.<br>☢ Radiation rises in storms. Shields block it.<br>❤ Crew health drops when air, food or shielding runs out.</p></div><div class="box"><h3>LIVING ON A REAL WORLD</h3><p style="margin:0">☀ Solar panels make the most when the Sun is high, and little at dawn and dusk.<br>🌡 Each world has its real temperature. In the cold, heaters use power (RTGs give off heat that helps). On Mercury's hot days, radiators do.<br>🟫 Dust settles on solar panels on the Moon, Mars, Mercury and Ceres. Walk up to a panel to brush it clean.<br>📡 Help from Earth waits for the radio signal, which travels at the speed of light: seconds from the Moon, much longer from Jupiter and Saturn.<br>☢ The number under radiation is your crew's total dose. NASA limits a whole career to 600 mSv.<br>📈 Moonquakes, marsquakes and ice quakes shake the base now and then.<br>👣 Footprints last forever on airless worlds, but blow away on Mars and Titan.<br>🔇 Sound is muffled in thin air, and on airless worlds you only hear what your suit carries.</p></div>

  const pool=DQP.filter(q=>q.id!=='exp'||mx>=1).slice(),qs=[];while(qs.length<3){const q=pool.splice(Math.floor(r()*pool.length),1)[0];const tier=qs.length;qs.push({id:q.id,t:q.n(q.v[tier]),n:q.v[tier],c:0,done:0})}
  d={d:t,q:qs,all:0};LS.set('dq',d)}return d}
function dqAdd(id,n=1,abs){if(!S||S.net==='guest'||S.tu!=null)return;const d=dqGet();let ch=0;d.q.forEach(q=>{if(q.id!==id||q.done)return;q.c=abs?Math.max(q.c,n):q.c+n;ch=1;if(q.c>=q.n){q.c=q.n;q.done=1;S.cr+=30;addXP(60);snd('qok');toast('✓','Daily quest done',q.t,'+30 coins · +60 XP')}});
 if(ch){if(!d.all&&d.q.every(q=>q.done)){d.all=1;addXP(150);setTimeout(()=>{toast('★','All daily quests done!','Come back tomorrow for new ones','+150 XP');snd('fanfare')},2600)}LS.set('dq',d)}}
function streakTick(){const t=today(),s=LS.get('streak',{d:'',n:0});if(s.d===t)return s;const y=new Date(Date.now()-864e5),yd=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
 const n=s.d===yd?s.n+1:1,o={d:t,n,claimed:0};LS.set('streak',o);return o}
function streakClaim(){const s=LS.get('streak',null);if(!s||s.claimed||s.d!==today())return;s.claimed=1;LS.set('streak',s);const b=40*Math.min(s.n,7);addXP(b);setTimeout(()=>{if(S&&S.run)toast('🔥',`Day ${s.n} streak`,`Welcome back, Commander!`,`+${b} XP · play tomorrow for more`)},6000)}
function rankHtml(){const R=rankOf(XP),d=dqGet(),s=LS.get('streak',{n:0});
 return`<div class="rkhead"><div class="rkbadge">${insignia(R.r,52)}</div><div style="flex:1"><b>${R.name}</b><div class="xpbar"><i style="width:${R.cur/R.need*100}%"></i></div><small class="sub">${R.cur} / ${R.need} XP · next: <b>${rankOf(XP+R.need-R.cur).name}</b> (${RREW(R.r+1)})</small></div><div class="strk" title="Days in a row">${I('fire')}<b>${s.n||0}</b><small>day streak</small></div></div>
 <h3 style="margin:8px 0 4px">TODAY’S QUESTS</h3>${d.q.map(q=>`<div class="dq${q.done?' done':''}"><span>${q.done?I('check'):''}</span><div style="flex:1"><div>${q.t}</div><div class="xpbar sm"><i style="width:${q.c/q.n*100}%"></i></div></div><small>${q.c}/${q.n}</small></div>`).join('')}
 <small class="sub">Each quest: +30 coins and +60 XP. New quests every day.</small>`}

  S.b.forEach(b=>{if(on({x:b.x+b.w/2,y:b.y+b.w/2}))dmgB(b,h.dps*.5*dt)});const q=Math.random();S.pt.push({x:h.x+(ex-h.x)*q,y:h.y+(ey-h.y)*q,vx:rnd(-25,25),vy:-25,l:.3,ml:.3,c:h.c,s:2})}}
