<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Red Dust Outpost</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0a12">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Red Dust"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: full-bleed game screen. HUD and mission feed float top-left, menu top-right,
   joystick bottom-left, action buttons bottom-right, build dock bottom-middle.
   One deliberate dark "mission console" look, so no light theme. */
:root{--void:#0d0a12;--panel:rgba(20,15,28,.86);--panel2:#231b30;--line:rgba(255,236,220,.18);--ink:#f5ede4;--dim:#b8acc2;
--signal:#ff7a3d;--ok:#5fe08a;--warn:#ffcf4a;--bad:#ff5466;--cool:#6cc8ff;
--disp:"Pixelify Sans","Courier New",monospace;--ui:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--ui);overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
#c{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.ui{position:absolute;z-index:3}

/* HUD */
#top{left:calc(8px + var(--sl));top:calc(8px + var(--st));display:flex;flex-direction:column;gap:5px;max-width:min(620px,calc(100% - 150px));pointer-events:none}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:3px 8px;display:flex;align-items:center;gap:5px;font-weight:600;font-size:13px;line-height:1.25;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-weight:700}.chip small{font-size:11px;font-weight:500;opacity:.85}
.chip.res{padding:3px 7px 3px 6px}
.mb{width:34px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}.mb i{display:block;height:100%;transition:width .25s}
.chip.w{border-color:var(--bad);background:rgba(90,16,28,.9);animation:blink .7s steps(2) infinite}
@keyframes blink{50%{border-color:transparent}}
.pos{color:var(--ok)}.neg{color:var(--bad)}
#wave{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.02em}
.daybar{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}.daybar i{display:block;height:100%}
.feed{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.msg{background:var(--panel);border-left:3px solid var(--warn);border-radius:6px;padding:4px 9px;font-size:13px;max-width:100%;white-space:normal}
.ban{pointer-events:auto;border-radius:8px;padding:7px 10px;font-size:13.5px;line-height:1.35;max-width:min(520px,100%);display:flex;gap:8px;align-items:flex-start}
.ban.fact{background:rgba(18,34,74,.92);border:1px solid #7fb0ff}
.ban.mc{background:rgba(14,52,40,.93);border:1px solid var(--ok)}
.ban.tut{background:rgba(92,58,4,.95);border:2px solid var(--warn);font-weight:600;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-2px)}}
.ban .lab{font-family:var(--disp);font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;display:block}
.ban button{margin-left:auto;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;flex:none}
#boss{background:var(--panel);border:1px solid var(--bad);border-radius:7px;padding:4px 8px;font-family:var(--disp);font-size:13px;width:min(320px,100%)}
#boss .mb{width:100%;height:7px;margin-top:3px}

#tr{right:calc(8px + var(--sr));top:calc(8px + var(--st));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#tr .r{display:flex;gap:6px}
.tb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-weight:700;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
#bShop{background:var(--signal);color:#1d0b02;border-color:transparent}
#nextw{background:#173a2a;border-color:var(--ok);font-size:13px}

#wb{position:absolute;inset:38% 0 auto;text-align:center;font:700 clamp(28px,6vw,52px) var(--disp);color:#fff;text-shadow:0 4px 0 #000,0 0 24px rgba(255,122,61,.8);opacity:0;pointer-events:none;z-index:2;transform:scale(.8);transition:opacity .35s,transform .35s}
#wb.on{opacity:1;transform:scale(1)}#wb.low{inset:66% 0 auto}
#stage.cine #dock,#stage.cine #act,#stage.cine #joy,#stage.cine #ctx,#stage.cine #tr,#stage.cine #top{display:none!important}
#wb small{display:block;font:600 15px var(--ui);text-shadow:0 2px 0 #000;margin-top:4px}

/* controls */
#joy{left:0;bottom:0;width:42%;height:62%;z-index:2;touch-action:none}
#jb,#jk{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
#jb{width:110px;height:110px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07)}
#jk{width:50px;height:50px;background:rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.5)}
#jhint{position:absolute;left:calc(26px + var(--sl));bottom:calc(26px + var(--sb));width:96px;height:96px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-size:12px;color:rgba(255,255,255,.65);text-align:center;pointer-events:none}
#act{right:calc(10px + var(--sr));bottom:calc(10px + var(--sb));display:flex;gap:8px;align-items:flex-end}
.rb{border-radius:50%;border:2px solid rgba(255,255,255,.55);color:#fff;font-weight:700;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.5);position:relative;touch-action:none;line-height:1.05;text-align:center}
.rb:active,.rb.dn{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
#fire{width:86px;height:86px;background:radial-gradient(circle at 35% 30%,#ff8c66,#d8321c);font-size:13px;grid-row:1/3;grid-column:2}
#emp{width:58px;height:58px;background:#2b4fa8;font-size:12px}
#emp .cdw{position:absolute;inset:-2px;border-radius:50%;pointer-events:none}
#emp.cool{filter:saturate(.3) brightness(.7)}
#wsw{width:50px;height:50px;background:#4a3a5e;font-size:18px}
#act .col{display:flex;flex-direction:column;gap:8px;align-items:center;grid-row:1/3;grid-column:1}
#dock{left:50%;transform:translateX(-50%);bottom:calc(8px + var(--sb));display:flex;gap:6px;align-items:flex-end;max-width:calc(100% - 2 * 236px - var(--sl) - var(--sr));z-index:3}
#cards{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px;border-radius:12px;background:rgba(10,7,14,.6);border:1px solid var(--line)}
#cards::-webkit-scrollbar{display:none}
.card{flex:none;width:56px;padding:4px 2px 3px;border-radius:9px;background:var(--panel2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;line-height:1.1}
.card img{width:30px;height:30px;image-rendering:pixelated}
.card .cost{font-size:10px;color:var(--warn);font-variant-numeric:tabular-nums}
.card.sel{border-color:var(--signal);background:#3a2418;box-shadow:0 0 0 2px rgba(255,122,61,.35)}
.card.no{opacity:.45}
#bh{width:64px;height:64px;flex:none;background:#2a8f4a;font-size:12px;border-radius:16px}
#bh img{width:24px;height:24px;image-rendering:pixelated;display:block;margin:0 auto 1px}

/* inspect */
#insp{right:calc(8px + var(--sr));top:calc(54px + var(--st));width:min(300px,calc(100% - 24px));max-height:calc(100% - 160px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#insp h3{margin:0 0 2px;font:700 17px var(--disp);display:flex;align-items:center;gap:8px}
#insp h3 img{width:28px;height:28px;image-rendering:pixelated}
#insp p{margin:4px 0;font-size:13px;color:var(--dim);line-height:1.35}
#insp .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-weight:700;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--signal);color:#1d0b02;border-color:transparent}
.btn.okb{background:#1d5a37;border-color:var(--ok)}
.btn.x{margin-left:auto}

/* overlays */
#ov,#shop{position:absolute;inset:0;z-index:6;overflow:auto;background:rgba(9,6,13,.86);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{max-width:640px;margin:0 auto;padding:calc(18px + var(--st)) max(16px,calc(16px + var(--sr))) calc(24px + var(--sb)) max(16px,calc(16px + var(--sl)))}
.sheet h1{font:700 clamp(30px,6vw,46px)/1 var(--disp);margin:6px 0 6px;color:var(--signal);text-shadow:0 3px 0 #3a1204;letter-spacing:.02em}
.sheet h2{font:700 24px/1.15 var(--disp);margin:4px 0 8px;text-wrap:balance}
.sheet p{line-height:1.5;margin:6px 0;color:var(--ink)}
.sheet .sub{color:var(--dim)}
.eyebrow{font:700 12px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--warn)}
.worlds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0 10px}
.wd{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px}
.wd .pl{width:42px;height:42px;border-radius:50%;box-shadow:inset -8px -6px 0 rgba(0,0,0,.35)}
.wd small{font-weight:500;color:var(--dim);font-size:11px}
.wd .stars{color:var(--warn);font-size:12px;letter-spacing:1px}
.wd.on{border-color:var(--signal);background:#2c1c20}
.wd:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 12px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--void)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.big{font:700 20px var(--disp);padding:12px 22px;border-radius:12px;background:var(--signal);color:#1d0b02;border:0;box-shadow:0 4px 0 #8a3510}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #8a3510}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.box h3{margin:0 0 6px;font:700 15px var(--disp);color:var(--cool);letter-spacing:.03em}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;font-variant-numeric:tabular-nums}
.stat div{background:rgba(0,0,0,.25);border-radius:8px;padding:6px 8px;font-size:13px}.stat b{display:block;font-size:17px}
.choice{display:block;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.choice:hover,.choice:focus-visible{border-color:var(--signal)}
.choice b{display:block;font-size:15.5px;margin-bottom:3px}
.fxl{display:flex;gap:5px;flex-wrap:wrap}.fxl span{font-size:12.5px;font-weight:700;padding:1px 7px;border-radius:5px;background:rgba(0,0,0,.35)}
.fxl .g{color:var(--ok)}.fxl .r{color:var(--bad)}
.q button{display:block;width:100%;text-align:left;margin:6px 0}
.q .right{border-color:var(--ok)!important;background:#16402a!important}.q .wrong{border-color:var(--bad)!important;background:#4a1620!important}
.starsbig{font-size:34px;color:var(--warn);letter-spacing:6px;text-shadow:0 3px 0 #5a3d00}
.starsbig .off{color:#4a4052;text-shadow:none}
.tabs{display:flex;gap:6px;margin:6px 0 10px}
.tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 14px;font-weight:700}
.tabs button.on{background:var(--ink);color:var(--void)}
.shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.it{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;text-align:left}
.it b{font-size:14.5px}.it span{font-size:12.5px;color:var(--dim);line-height:1.3}
.it .pr{color:var(--warn);font-weight:700;font-size:13px}
.it:disabled{opacity:.45;cursor:not-allowed}
.jw{margin:10px 0}.jw h3{font:700 16px var(--disp);margin:0 0 4px}
.jw li{margin:4px 0;line-height:1.4;font-size:13.5px}.jw li.lk{color:#6f6578}
.shead{display:flex;align-items:center;gap:10px;justify-content:space-between;position:sticky;top:0;background:rgba(9,6,13,.95);padding:6px 0;z-index:1}
.wallet{font-weight:700;font-variant-numeric:tabular-nums}
#rot{position:absolute;inset:44% 0 auto;text-align:center;z-index:5;pointer-events:none}
#rot span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px}

#earth{width:62px;height:62px;background:radial-gradient(circle at 35% 30%,#62b8ff,#1a4fb0 70%);font-size:11px}
#earth.ready{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 18px 5px rgba(108,200,255,.8)}}
#earth .cdw{position:absolute;inset:-6px;border-radius:50%;pointer-events:none;-webkit-mask:radial-gradient(circle,transparent 63%,#000 65%);mask:radial-gradient(circle,transparent 63%,#000 65%)}
#tray{right:calc(10px + var(--sr));bottom:calc(104px + var(--sb));display:flex;gap:6px;background:var(--panel);border:1px solid var(--cool);border-radius:14px;padding:6px;z-index:5}
.ci{width:68px;padding:5px 3px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:700;line-height:1.15;text-align:center}
.ci i{font-style:normal;font-size:20px}.ci .cost{color:var(--cool)}.ci:disabled{opacity:.4;cursor:not-allowed}
.ban.earth{background:rgba(12,38,84,.94);border:1px solid var(--cool)}
.pkb .right{border-color:var(--ok)!important;background:#16402a!important}
#stage.nohud .ui,#stage.nohud #wb{display:none!important}
#ov.clear{background:linear-gradient(90deg,rgba(9,6,13,.92) 0%,rgba(9,6,13,.72) 42%,rgba(9,6,13,0) 72%);backdrop-filter:none;-webkit-backdrop-filter:none}
#ov.clear .sheet{margin:0;max-width:min(560px,100%)}
#cut{position:absolute;inset:0;z-index:7;cursor:pointer;user-select:none;-webkit-user-select:none}
#cuttitle{position:absolute;top:calc(14px + var(--st));left:0;right:0;text-align:center;font:700 clamp(20px,4.5vw,38px) var(--disp);color:#fff;letter-spacing:.06em;text-shadow:0 3px 0 #000,0 0 18px rgba(108,200,255,.6);opacity:0;transition:opacity .8s;pointer-events:none}
#cutbox{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sb));width:min(660px,calc(100% - 24px));background:rgba(10,8,20,.9);border:2px solid var(--cool);border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#cutp{width:60px;height:60px;image-rendering:pixelated;border-radius:10px;flex:none;border:1px solid var(--line)}
#cutwho{font:700 12px var(--disp);letter-spacing:.08em;color:var(--cool);text-transform:uppercase}
#cuttxt{font-size:15.5px;line-height:1.4;min-height:44px;margin-top:2px}
#cutbox .nav{display:flex;justify-content:flex-end;margin-top:4px}
#cutskip{position:absolute;right:calc(10px + var(--sr));top:calc(10px + var(--st));z-index:1}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9;transition:opacity .35s}
.tabs{flex-wrap:wrap}
.crewg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.cm{display:flex;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px}
.cm img{width:44px;height:44px;image-rendering:pixelated;border-radius:8px;flex:none}
.cm b{font-size:15px}.cm .jb{font-size:12.5px;font-weight:700}.cm small{display:block;color:var(--dim);font-size:12px;margin-top:3px;line-height:1.3}
.jobs{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.jbtn{width:36px;height:32px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid var(--line);font-size:16px}.jbtn.on{background:var(--ink);border-color:var(--ink)}
.sect{font:700 15px var(--disp);margin:12px 0 6px;color:var(--cool)}
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.sty{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.sty img{width:72px;height:60px;image-rendering:pixelated;border-radius:8px}.sty b{font-size:13px}.sty small{font-size:11px;color:var(--dim);line-height:1.25}
.sty.on{border-color:var(--signal);background:#2c1c20}.sty:disabled{opacity:.5;cursor:not-allowed}
#crew{pointer-events:auto;cursor:pointer}
/* online screens */
.box.online{border-color:rgba(108,200,255,.45);background:linear-gradient(135deg,rgba(18,34,74,.55),var(--panel2))}
.scorebox{text-align:center}.bigscore{font:700 clamp(34px,8vw,52px)/1 var(--disp);color:var(--warn);text-shadow:0 3px 0 #5a3d00;font-variant-numeric:tabular-nums}
.nb{color:var(--ok);font-weight:700}.flash{background:#16402a;border:1px solid var(--ok);border-radius:10px;padding:8px 12px}
.frow{display:flex;gap:8px;flex-wrap:wrap}.frow input{flex:1;min-width:0}.fcol{display:flex;flex-direction:column;gap:8px;max-width:420px}
.sheet input{font:inherit;font-size:16px;color:var(--ink);background:#120d18;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sheet input:focus{outline:2px solid var(--signal);outline-offset:1px}
.ferr{color:var(--warn);font-size:13px;margin:6px 0 0;min-height:1em}
.lbt{display:flex;flex-direction:column;gap:4px}.lbr{display:grid;grid-template-columns:48px 1fr auto 90px;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-variant-numeric:tabular-nums}
.lbr.me{border-color:var(--signal);background:#2c1c20}.lbr .rk{font-weight:700;font-size:15px}.lbr .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr .st{color:var(--warn);font-size:12px}.lbr .sc{text-align:right;font:700 15px var(--disp)}
.lbtabs button{padding:6px 10px;font-size:13px}
.dmods{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:10px 0}.dmod{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--warn);border-radius:12px;padding:9px 11px}.dmod span{font-size:26px}.dmod b{display:block}.dmod small{color:var(--dim);font-size:12.5px}
.roomcode{display:flex;justify-content:center;gap:8px;margin:10px 0}.roomcode span{width:52px;height:64px;display:grid;place-items:center;font:700 38px var(--disp);background:var(--panel2);border:2px solid var(--signal);border-radius:12px;color:var(--warn)}
.big:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
@media (max-width:480px){.lbr{grid-template-columns:40px 1fr 74px}.lbr .st{display:none}}
#shop{z-index:8}
#toast{position:absolute;left:50%;top:calc(10px + var(--st));transform:translateX(-50%);z-index:9;display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#3a2a08,#5e400c);border:2px solid var(--warn);border-radius:12px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none;max-width:calc(100% - 24px)}
