# Download build for the realism branch: makes the Android app (APK) and a Windows zip, and puts both on a
# GitHub PRE-release. It does NOT deploy the website and does NOT mark the release as "latest" (main stays the official version).
name: Realism download build

on:
  push:
    branches: [high-end-quality-realism-upgrade]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realism-dl
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Run game checks
        continue-on-error: true
        run: node tests/run.mjs

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash screen
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0d0a12' --splashBackgroundColor '#0d0a12'

      - name: Landscape, fullscreen and vibration
        run: node scripts/android-setup.mjs

      - name: Copy the game into the app
        run: npx cap sync android

      - name: Same signing key every build, so updates install over the old app
        run: mkdir -p ~/.android && base64 -d scripts/debug-keystore.txt > ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon || (node ../scripts/android-setup.mjs --plain && ./gradlew assembleDebug --no-daemon)

      - name: Name the files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RedDustOutpost-Realism.apk
          mkdir -p pc/RedDustOutpost && cp -r www "Play on Windows.bat" play-server.ps1 pc/RedDustOutpost/
          (cd pc && zip -qr ../RedDustOutpost-Realism-Windows.zip RedDustOutpost)

      - name: Publish the downloads (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: realism-${{ github.run_number }}
          name: Red Dust Outpost - realism preview ${{ github.run_number }}
          body: |
            Test version with the Adventure Mode realism upgrade.
            - Phone (Android): download RedDustOutpost-Realism.apk and open it to install.
            - Computer (Windows): download RedDustOutpost-Realism-Windows.zip, unzip it, double-click "Play on Windows.bat".
          files: |
            RedDustOutpost-Realism.apk
            RedDustOutpost-Realism-Windows.zip
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
