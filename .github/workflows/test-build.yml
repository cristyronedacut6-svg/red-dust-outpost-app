# Test build: makes the Android app from a release-* branch WITHOUT publishing anything.
# No website deploy, no Releases page. The APK appears only on the run's page (Actions tab), for you to try on your phone.
name: Test build (no publishing)

on:
  push:
    branches: ['release-*', 'moon-survival']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android test app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Run game checks
        run: node tests/run.mjs

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash screen
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0d0a12' --splashBackgroundColor '#0d0a12'

      - name: Landscape, fullscreen and vibration
        run: node scripts/android-setup.mjs

      - name: Copy the game into the app
        run: npx cap sync android

      - name: Same signing key every build, so updates install over the old app
        run: mkdir -p ~/.android && base64 -d scripts/debug-keystore.txt > ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon || (node ../scripts/android-setup.mjs --plain && ./gradlew assembleDebug --no-daemon)

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RedDustOutpost.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: RedDustOutpost-TEST-${{ github.ref_name }}
          path: RedDustOutpost.apk

