# Builds the Android app (APK) and publishes the web version to GitHub Pages
# every time you upload changes to the main branch. You can also run it by hand:
# Actions tab > "Build app and website" > Run workflow.
name: Build app and website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Run game checks
        run: node tests/run.mjs

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash screen
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0d0a12' --splashBackgroundColor '#0d0a12'

      - name: Landscape, fullscreen and vibration
        run: node scripts/android-setup.mjs

      - name: Copy the game into the app
        run: npx cap sync android

      - name: Same signing key every build, so updates install over the old app
        run: mkdir -p ~/.android && base64 -d scripts/debug-keystore.txt > ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon || (node ../scripts/android-setup.mjs --plain && ./gradlew assembleDebug --no-daemon)

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RedDustOutpost.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: RedDustOutpost-android
          path: RedDustOutpost.apk

      - name: Publish a download link (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Red Dust Outpost · build ${{ github.run_number }}
          body: Download **RedDustOutpost.apk** below and open it on an Android phone to install.
          files: RedDustOutpost.apk
          make_latest: true

  website:
    name: Web version (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
